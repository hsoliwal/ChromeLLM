# Linux example for an explicitly selected Maven smart-build profile.
# Build the JNI bridge with -Pfork-native first, or in the same Maven invocation.
promptFile=examples/smart-build-prompt.txt
backend=jni
jniLib=target/fork-native/libchromellm_llama_jni.so
modelUrl=https://github.com/hsoliwal/ChromeLLM/releases/download/model-smollm2-135m-q4km-8030f045/weights.bin
modelSha256=8030f04528538d47bda434f6f0bdf3952c40a58123e4d5e755332f23731a8684
modelCacheDir=target/model-cache
contextTokens=512
threads=2
computeBackend=cpu
gpuLayers=0
maxTokens=32
timeoutSeconds=120
