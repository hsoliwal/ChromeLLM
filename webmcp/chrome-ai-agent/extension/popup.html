<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M3 Chrome AI Build Planner</title>
  <style>
    body { font: 13px system-ui, sans-serif; min-width: 360px; max-width: 440px; margin: 16px; color: #1f2937; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    label { display:block; margin-bottom: 8px; }
    select, button { font: inherit; padding: 6px; }
    button { margin: 6px 6px 6px 0; cursor: pointer; }
    pre { white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow:auto; padding:10px; background: #f3f4f6; }
    #status { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>M3 Smart Build — Chrome AI</h1>
  <label for="repo">Approved checkout</label>
  <select id="repo">
    <option value="ChromeLLM">ChromeLLM</option>
    <option value="dawn">Dawn</option>
    <option value="synexia-llmcpp">synexia-llmcpp</option>
    <option value="maven">Maven fork</option>
  </select>
  <div><button id="inspect">Inspect metadata</button><button id="propose">Propose with Chrome AI</button><button id="copy" disabled>Copy candidate</button></div>
  <div id="status" role="status" aria-live="polite">No commands executed. Local read-only host required.</div>
  <pre id="result">Choose a repository and inspect it.</pre>
  <script src="popup.js"></script>
</body>
</html>
