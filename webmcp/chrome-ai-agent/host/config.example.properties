# Set these to already-existing, approved checkout directories. Paths are read-only.
# No path is created or changed by the agent.
repo.ChromeLLM=/absolute/path/to/ChromeLLM
repo.dawn=/absolute/path/to/dawn
repo.synexia-llmcpp=/absolute/path/to/synexia-llmcpp
repo.maven=/absolute/path/to/maven

# Match the installed unpacked extension ID; no wildcards are allowed.
agent.allowed_origin=chrome-extension://REPLACE_WITH_REAL_EXTENSION_ID/
