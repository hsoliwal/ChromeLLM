name: Browser WebMCP adapter
on:
  push:
    paths: ['webmcp/**', '.github/workflows/webmcp-adapter.yml']
  pull_request:
    paths: ['webmcp/**', '.github/workflows/webmcp-adapter.yml']
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript module and test syntax
        run: |
          node --check webmcp/register-chromellm-tools.mjs
          node --check webmcp/register-chromellm-tools.test.mjs
      - name: Run browser tool adapter contract tests without network
        run: node --test webmcp/register-chromellm-tools.test.mjs
