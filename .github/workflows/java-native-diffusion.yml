name: java-native-diffusion-gpu-vision

on:
  push:
    branches:
      - main
      - feature/java-native-diffusion
      - feature/gpu-image-video
      - feature/opencv-ffmpeg-native
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  native:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ffmpeg libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libopencv-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - if: runner.os == 'Linux'
        run: mvn -B -Dchromellm.native.integration=true -Djava.library.path=$GITHUB_WORKSPACE/build test
