name: Standalone inference
on:
  workflow_dispatch:
    inputs:
      run_chrome_ai:
        description: Run the installed-Chrome model smoke test on the trusted chrome-ai runner
        type: boolean
        required: true
        default: false
  push:
    paths: ['standalone/**', '.github/workflows/standalone-core.yml']
  pull_request:
    paths: ['standalone/**', '.github/workflows/standalone-core.yml']
jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: standalone/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn -B -ntp -f standalone/pom.xml verify
      - name: Reject conflicting native Maven profiles before CMake
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for profiles in native-synthetic,native-fork fork-native,native-synthetic fork-native,native-fork; do
            if mvn -B -ntp -f standalone/pom.xml -P"$profiles" -Dchromellm.native.source=/unavailable-for-validation validate > profile-conflict.log 2>&1; then
              echo "Conflicting native profiles unexpectedly passed validate: $profiles" >&2
              exit 1
            fi
            cat profile-conflict.log
            grep -E 'native-synthetic and native-fork cannot be active together|fork-native cannot be combined with another native build profile' profile-conflict.log
          done
          test ! -e standalone/target/native-synthetic/CMakeCache.txt
          test ! -e standalone/target/native-fork/CMakeCache.txt
          test ! -e standalone/target/fork-native/CMakeCache.txt
      - name: Verify JDK-only runtime modules
        shell: bash
        run: test "$(jdeps --print-module-deps standalone/target/chromellm-standalone-0.1.0-SNAPSHOT.jar | tr -d '\r')" = java.base,java.net.http,jdk.httpserver
  jni-synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: standalone/target/native-synthetic/libchromellm_llama_jni.so
            separator: ':'
          - os: windows-latest
            library: standalone/target/native-synthetic/Release/chromellm_llama_jni.dll
            separator: ';'
          - os: macos-latest
            library: standalone/target/native-synthetic/libchromellm_llama_jni.dylib
            separator: ':'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: standalone/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject legacy embedded browser runtime files
        run: |
          git ls-files runtime reference scripts/build_runner.ps1 scripts/m3_rebuild_runner.py src/main/java/io/synexia/chromellm/chrome | tee /tmp/legacy-browser-tracked.txt
          test ! -s /tmp/legacy-browser-tracked.txt
          test ! -e docs/OPENAI_COMPAT_API.md
          test ! -e docs/M3_REBUILD_AND_DISTILLATION.md
          test ! -e '关键数据.md'
      - name: Maven native-synthetic build and CTest regressions
        run: mvn -B -ntp -f standalone/pom.xml -Pnative-synthetic verify
      - name: Expose synthetic DLL dependencies to the Windows loader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeDir = Join-Path $env:GITHUB_WORKSPACE 'standalone\target\native-synthetic\Release'
          foreach ($name in @('chromellm_llama_stub.dll', 'chromellm_llama_jni.dll')) {
            if (-not (Test-Path -PathType Leaf (Join-Path $nativeDir $name))) {
              throw "Missing synthetic native artifact: $name"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nativeDir
      - name: Verify no browser runtime linkage
        if: runner.os == 'Linux'
        run: |
          if readelf -d standalone/target/native-synthetic/libchromellm_llama_jni.so | grep -Ei 'optimization_guide_internal|libnode'; then
            echo 'Forbidden browser runtime linkage detected' >&2
            exit 1
          fi
      - run: mvn -B -ntp -f standalone/pom.xml test-compile
      - run: java -Xcheck:jni -cp "standalone/target/classes${{ matrix.separator }}standalone/target/test-classes" io.synexia.chromellm.standalone.JniSyntheticContractTestMain "${{ github.workspace }}/${{ matrix.library }}"
      - name: Reject an unavailable WebGPU provider
        env:
          CHROMELLM_TEST_NO_WEBGPU: '1'
        run: java -Xcheck:jni -cp "standalone/target/classes${{ matrix.separator }}standalone/target/test-classes" io.synexia.chromellm.standalone.JniSyntheticContractTestMain "${{ github.workspace }}/${{ matrix.library }}"
      - name: Bound JNI prompt encoding before allocation
        run: java -Xcheck:jni -Xmx32m -cp "standalone/target/classes${{ matrix.separator }}standalone/target/test-classes" io.synexia.chromellm.standalone.JniSyntheticContractTestMain "${{ github.workspace }}/${{ matrix.library }}" oversize-memory
  chrome-ai-live:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_chrome_ai }}
    runs-on: [self-hosted, linux, chrome-ai]
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-chrome-ai-live
      cancel-in-progress: false
    env:
      CHROME_BIN: ${{ vars.CHROME_BIN }}
      CHROMELLM_CHROME_PROFILE: ${{ vars.CHROMELLM_CHROME_PROFILE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require an explicitly configured dedicated profile
        run: |
          test -n "$CHROMELLM_CHROME_PROFILE"
          test -n "$CHROME_BIN"
          test -x "$CHROME_BIN"
      - name: Read installed Chrome availability without provisioning
        run: |
          set -o pipefail
          mvn -B -ntp -f standalone/pom.xml -Pchrome-status \
            -Dchromellm.chrome.profile="$CHROMELLM_CHROME_PROFILE" \
            -Dchromellm.chrome.timeoutSeconds=60 verify | tee chrome-status.log
      - name: Run real built-in AI inference without fallback
        run: |
          set -o pipefail
          printf '%s\n' 'Reply with a short greeting.' > "$RUNNER_TEMP/chromellm-smoke-prompt.txt"
          mvn -B -ntp -f standalone/pom.xml -Pchrome-infer \
            -Dchromellm.chrome.profile="$CHROMELLM_CHROME_PROFILE" \
            -Dchromellm.chrome.promptFile="$RUNNER_TEMP/chromellm-smoke-prompt.txt" \
            -Dchromellm.chrome.maxTokens=128 \
            -Dchromellm.chrome.timeoutSeconds=180 verify | tee chrome-infer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-chrome-ai-smoke
          path: |
            chrome-status.log
            chrome-infer.log
          retention-days: 7
