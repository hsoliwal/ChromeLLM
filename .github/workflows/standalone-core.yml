name: Standalone inference
on:
  workflow_dispatch:
    inputs:
      run_chrome_ai:
        description: Run the installed-Chrome model smoke test on the trusted chrome-ai runner
        type: boolean
        required: true
        default: false
  push:
    paths: ['standalone/**', '.github/workflows/standalone-core.yml']
  pull_request:
    paths: ['standalone/**', '.github/workflows/standalone-core.yml']
jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: standalone/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mvn -B -ntp -f standalone/pom.xml verify
      - name: Reject conflicting native profiles with the configured regex diagnostic
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for profiles in native-synthetic,native-fork fork-native,native-synthetic fork-native,native-fork; do
            if mvn -B -ntp -f standalone/pom.xml -P"$profiles" -Dchromellm.native.source=/unavailable-for-validation validate > profile-conflict.log 2>&1; then
              echo "Conflicting native profiles unexpectedly passed validate: $profiles" >&2
              exit 1
            fi
            cat profile-conflict.log
            grep -E 'native-synthetic and native-fork cannot be active together|fork-native cannot be combined with another native build profile' profile-conflict.log
          done
          test ! -e standalone/target/native-synthetic/CMakeCache.txt
          test ! -e standalone/target/native-fork/CMakeCache.txt
          for mode in fork synthetic; do
            if mvn -B -ntp -f standalone/pom.xml -Pnative-synthetic,fork-native \
                -Dchromellm.native.mode="$mode" validate > fork-profile-conflict.log 2>&1; then
              echo 'Synthetic and pinned fork profiles unexpectedly passed validate' >&2
              exit 1
            fi
            cat fork-profile-conflict.log
            grep -E 'native-synthetic and (native-fork|fork-native) cannot be active together' fork-profile-conflict.log
          done
          test ! -e standalone/target/fork-native/CMakeCache.txt
          if mvn -B -ntp -f standalone/pom.xml -Pfork-native,native-dawn \
              -Dchromellm.fork.webgpu=OFF validate > dawn-profile-conflict.log 2>&1; then
            echo 'Dawn and a disabled pinned fork WebGPU backend unexpectedly passed validate' >&2
            exit 1
          fi
          cat dawn-profile-conflict.log
          grep -F 'native-dawn requires the pinned fork WebGPU=ON' dawn-profile-conflict.log
          test ! -e standalone/target/fork-native/CMakeCache.txt
      - name: Verify JDK-only runtime modules
        shell: bash
        run: test "$(jdeps --print-module-deps standalone/target/chromellm-standalone-0.1.0-SNAPSHOT.jar | tr -d '\r')" = java.base,java.net.http,jdk.httpserver
  jni-synthetic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            library: standalone/target/native-synthetic/libchromellm_llama_jni.so
            separator: ':'
          - os: windows-latest
            library: standalone/target/native-synthetic/Release/chromellm_llama_jni.dll
            separator: ';'
          - os: macos-latest
            library: standalone/target/native-synthetic/libchromellm_llama_jni.dylib
            separator: ':'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: standalone/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject legacy embedded browser runtime files
        run: |
          git ls-files runtime reference scripts/build_runner.ps1 scripts/m3_rebuild_runner.py src/main/java/io/synexia/chromellm/chrome | tee /tmp/legacy-browser-tracked.txt
          test ! -s /tmp/legacy-browser-tracked.txt
          test ! -e docs/OPENAI_COMPAT_API.md
          test ! -e docs/M3_REBUILD_AND_DISTILLATION.md
          test ! -e '关键数据.md'
      - name: Maven native-synthetic build and CTest regressions
        run: mvn -B -ntp -f standalone/pom.xml -Pnative-synthetic verify
      - name: Expose synthetic DLL dependencies to the Windows loader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeDir = Join-Path $env:GITHUB_WORKSPACE 'standalone\target\native-synthetic\Release'
          foreach ($name in @('chromellm_llama_stub.dll', 'chromellm_llama_jni.dll')) {
            if (-not (Test-Path -PathType Leaf (Join-Path $nativeDir $name))) {
              throw "Missing synthetic native artifact: $name"
            }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nativeDir
      - name: Verify no browser runtime linkage
        if: runner.os == 'Linux'
        run: |
          if readelf -d standalone/target/native-synthetic/libchromellm_llama_jni.so | grep -Ei 'optimization_guide_internal|libnode'; then
            echo 'Forbidden browser runtime linkage detected' >&2
            exit 1
          fi
      - run: mvn -B -ntp -f standalone/pom.xml test-compile
      - run: java -Xcheck:jni -cp "standalone/target/classes${{ matrix.separator }}standalone/target/test-classes" io.synexia.chromellm.standalone.JniSyntheticContractTestMain "${{ github.workspace }}/${{ matrix.library }}"
      - name: Reject an unavailable WebGPU provider
        env:
          CHROMELLM_TEST_NO_WEBGPU: '1'
        run: java -Xcheck:jni -cp "standalone/target/classes${{ matrix.separator }}standalone/target/test-classes" io.synexia.chromellm.standalone.JniSyntheticContractTestMain "${{ github.workspace }}/${{ matrix.library }}"
      - name: Bound JNI prompt encoding before allocation
        run: java -Xcheck:jni -Xmx32m -cp "standalone/target/classes${{ matrix.separator }}standalone/target/test-classes" io.synexia.chromellm.standalone.JniSyntheticContractTestMain "${{ github.workspace }}/${{ matrix.library }}" oversize-memory
  real-model:
    # Public CI uses the same immutable, public source donor as the prior real GGUF gate.
    # Locally, fork-native accepts an independently checked-out private Synexia fork too.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      LLAMA_COMMIT: 889f2ec96deacbc2d8a9a67dbe181eaa43a2fb3b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 889f2ec96deacbc2d8a9a67dbe181eaa43a2fb3b
          path: external/llama.cpp
          persist-credentials: false
  chrome-ai-live:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_chrome_ai }}
    runs-on: [self-hosted, linux, chrome-ai]
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.repository }}-chrome-ai-live
      cancel-in-progress: false
    env:
      CHROME_BIN: ${{ vars.CHROME_BIN }}
      CHROMELLM_CHROME_PROFILE: ${{ vars.CHROMELLM_CHROME_PROFILE }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
  native-binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
  real-cpu-smart-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      LLAMA_COMMIT: 889f2ec96deacbc2d8a9a67dbe181eaa43a2fb3b
      MODEL_SHA256: 8030f04528538d47bda434f6f0bdf3952c40a58123e4d5e755332f23731a8684
      MODEL_BYTES: '105454144'
      MODEL_URL: https://github.com/hsoliwal/ChromeLLM/releases/download/model-smollm2-135m-q4km-8030f045/weights.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: standalone/pom.xml
      - name: Select model cache directory
        shell: bash
        run: echo "MODEL_CACHE=$RUNNER_TEMP/chromellm-models" >> "$GITHUB_ENV"
      - name: Reuse checksum-verified model cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE }}
          key: chromellm-gguf-8030f04528538d47bda434f6f0bdf3952c40a58123e4d5e755332f23731a8684
      - name: Maven build, model acquisition and real JNI inference
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f standalone/pom.xml -Pfork-native,real-model-test \
            -Dchromellm.fork.source="$PWD/external/llama.cpp" \
            -Dchromellm.fork.commit="$LLAMA_COMMIT" \
            -Dchromellm.real.model.cache="$MODEL_CACHE" verify \
            2>&1 | tee "$RUNNER_TEMP/real-model-first.log"
          grep -F 'PASS: licensed GGUF CPU inference, deterministic repeat, receipts and close' "$RUNNER_TEMP/real-model-first.log"
          if grep -E 'WARNING in native method|FATAL ERROR in native method' "$RUNNER_TEMP/real-model-first.log"; then
            exit 1
          fi
      - name: Reuse the downloaded model in an offline Maven smart build
        shell: bash
        run: |
          set -euo pipefail
          cat > standalone/target/real-smart-build.properties <<EOF
          promptFile=examples/smart-build-prompt.txt
          backend=jni
          jniLib=$PWD/standalone/target/fork-native/libchromellm_llama_jni.so
          modelUrl=https://github.com/hsoliwal/ChromeLLM/releases/download/model-smollm2-135m-q4km-8030f045/weights.bin
          modelSha256=8030f04528538d47bda434f6f0bdf3952c40a58123e4d5e755332f23731a8684
          modelCacheDir=$MODEL_CACHE
          contextTokens=512
          threads=2
          gpuLayers=0
          computeBackend=cpu
          maxTokens=48
          timeoutSeconds=120
          EOF
          mvn -o -B -ntp -f standalone/pom.xml -Pfork-native,real-model-test,smart-build \
            -Dchromellm.fork.source="$PWD/external/llama.cpp" \
            -Dchromellm.fork.commit="$LLAMA_COMMIT" \
            -Dchromellm.real.model.cache="$MODEL_CACHE" \
            -Dchromellm.smart.recipe=target/real-smart-build.properties verify \
            2>&1 | tee "$RUNNER_TEMP/real-model-offline.log"
          grep -F 'Model artifact: verified cache hit' "$RUNNER_TEMP/real-model-offline.log"
          grep -F 'ChromeLLM smart-build candidate SHA-256:' "$RUNNER_TEMP/real-model-offline.log"
          if grep -E 'WARNING in native method|FATAL ERROR in native method' "$RUNNER_TEMP/real-model-offline.log"; then
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require an explicitly configured dedicated profile
        run: |
          test -n "$CHROMELLM_CHROME_PROFILE"
          test -n "$CHROME_BIN"
          test -x "$CHROME_BIN"
      - name: Read installed Chrome availability without provisioning
        run: |
          set -o pipefail
          mvn -B -ntp -f standalone/pom.xml -Pchrome-status \
            -Dchromellm.chrome.profile="$CHROMELLM_CHROME_PROFILE" \
            -Dchromellm.chrome.timeoutSeconds=60 verify | tee chrome-status.log
      - name: Run real built-in AI inference without fallback
        run: |
          set -o pipefail
          printf '%s\n' 'Reply with a short greeting.' > "$RUNNER_TEMP/chromellm-smoke-prompt.txt"
          mvn -B -ntp -f standalone/pom.xml -Pchrome-infer \
            -Dchromellm.chrome.profile="$CHROMELLM_CHROME_PROFILE" \
            -Dchromellm.chrome.promptFile="$RUNNER_TEMP/chromellm-smoke-prompt.txt" \
            -Dchromellm.chrome.maxTokens=128 \
            -Dchromellm.chrome.timeoutSeconds=180 verify | tee chrome-infer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-chrome-ai-smoke
          path: |
            chrome-status.log
            chrome-infer.log
          retention-days: 7
          cache: maven
          cache-dependency-path: standalone/pom.xml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/chromellm
          key: linux-x64-chromellm-binaries-${{ hashFiles('standalone/src/main/java/io/synexia/chromellm/standalone/NativeBuildArtifacts.java') }}
          restore-keys: linux-x64-chromellm-binaries-
      - name: Install the software Vulkan test driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          driver=$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*.json' -print -quit)
          test -n "$driver"
          echo "VK_ICD_FILENAMES=$driver" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Maven downloads, verifies and executes the Dawn binary
        run: mvn -B -ntp -f standalone/pom.xml -Pdawn-binary verify
      - name: Checkout the public source used by the existing real-model CI
      - name: Check out exact public llama.cpp source for the CPU test
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 889f2ec96deacbc2d8a9a67dbe181eaa43a2fb3b
          path: external/llama.cpp
          persist-credentials: false
      - name: Maven builds JNI and downloads the pinned real model for inference
        shell: bash
        run: |
          mvn -B -ntp -f standalone/pom.xml -Pfork-native,real-model verify \
            -Dchromellm.fork.source="$GITHUB_WORKSPACE/external/llama.cpp" \
            -Dchromellm.fork.commit=889f2ec96deacbc2d8a9a67dbe181eaa43a2fb3b
      - name: Verify binary cache reuse without network access
        run: mvn -o -B -ntp -f standalone/pom.xml -Pdawn-binary,real-model process-classes
      - name: Build the current real CPU JNI bridge through Maven
        run: |
          set -euo pipefail
          test "$(git -C external/llama.cpp rev-parse HEAD)" = "$LLAMA_COMMIT"
          mvn -B -ntp -f standalone/pom.xml -Pnative-fork \
            -Dchromellm.native.source="$GITHUB_WORKSPACE/external/llama.cpp" \
            -Dchromellm.native.webgpu=OFF verify
          test -s standalone/target/native-fork/libchromellm_llama_jni.so
      - name: Prepare the explicit real-model Smart Build recipe
        # Apache-2.0 SmolLM2-135M-Instruct Q4_K_M, unchanged GGUF v3 named weights.bin.
        # https://github.com/hsoliwal/ChromeLLM/releases/tag/model-smollm2-135m-q4km-8030f045
        # https://github.com/hsoliwal/ChromeLLM/releases/download/model-smollm2-135m-q4km-8030f045/LICENSE
        # https://github.com/hsoliwal/ChromeLLM/releases/download/model-smollm2-135m-q4km-8030f045/NOTICE.txt
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          root = Path.cwd() / 'standalone'
          work = root / 'target' / 'real-cpu-smoke'
          cache = root / 'target' / 'model-cache'
          work.mkdir(parents=True, exist_ok=True)
          cache.mkdir(parents=True, exist_ok=True)
          prompt = '<|im_start|>user\nWrite one short sentence about an oak tree.<|im_end|>\n<|im_start|>assistant\n'
          (work / 'prompt.txt').write_text(prompt, encoding='utf-8')
          values = {
              'promptFile': 'target/real-cpu-smoke/prompt.txt',
              'backend': 'jni',
              'jniLib': str(root / 'target/native-fork/libchromellm_llama_jni.so'),
              'modelUrl': os.environ['MODEL_URL'],
              'modelSha256': os.environ['MODEL_SHA256'],
              'modelCacheDir': str(cache),
              'computeBackend': 'cpu', 'gpuLayers': '0',
              'contextTokens': '512', 'threads': '2',
              'maxTokens': '48', 'timeoutSeconds': '90',
          }
          (work / 'smart-build.properties').write_text(
              ''.join(key + '=' + value + '\n' for key, value in values.items()), encoding='utf-8')
          PYTHON
      - name: Download the pinned release and execute Maven Smart Build
        env:
          MAVEN_OPTS: '-Xcheck:jni'
        run: |
          set -euo pipefail
          # Start cold so every run proves the Java GitHub-release download path.
          # The following contract step proves reuse of this same verified cache.
          test ! -e "standalone/target/model-cache/$MODEL_SHA256.gguf"
          mvn -B -ntp -f standalone/pom.xml -Psmart-build verify \
            -Dchromellm.smart.recipe=target/real-cpu-smoke/smart-build.properties \
            2>&1 | tee standalone/target/real-cpu-smoke/maven-smart-build.log
          test "$(stat -c %s "standalone/target/model-cache/$MODEL_SHA256.gguf")" = "$MODEL_BYTES"
          echo "$MODEL_SHA256  standalone/target/model-cache/$MODEL_SHA256.gguf" | sha256sum --check
          if grep -E 'WARNING in native method|FATAL ERROR in native method' standalone/target/real-cpu-smoke/maven-smart-build.log; then
            echo 'Real-model Maven JNI warning gate failed' >&2
            exit 1
          fi
      - name: Verify real inference, warm cache, corruption rejection and native close
        run: |
          set -euo pipefail
          java -Xcheck:jni -cp standalone/target/classes:standalone/target/test-classes \
            io.synexia.chromellm.standalone.RealGgufContractTestMain \
            "$GITHUB_WORKSPACE/standalone/target/native-fork/libchromellm_llama_jni.so" \
            "$GITHUB_WORKSPACE/standalone/target/model-cache" \
            "$GITHUB_WORKSPACE/standalone/target/real-cpu-smoke" \
            "$MODEL_URL" "$MODEL_SHA256" \
            2>&1 | tee standalone/target/real-cpu-smoke/real-gguf.log
          grep -F 'PASS: real GGUF CPU smart build, cache reuse, corruption refusal, receipts and close' \
            standalone/target/real-cpu-smoke/real-gguf.log
          if grep -E 'WARNING in native method|FATAL ERROR in native method' standalone/target/real-cpu-smoke/real-gguf.log; then
            echo 'Real-model native contract JNI warning gate failed' >&2
            exit 1
          fi
