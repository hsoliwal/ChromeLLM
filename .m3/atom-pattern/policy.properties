policy.version=M3_TYPED_HIERARCHY/1
scope.order=FILE,PACKAGE,MODULE,PROJECT,REPOSITORY
scope.include=ALL_TRACKED_FILES
scope.missingSources=FAIL_CLOSED
source.mutation=false
source.promotion=false
java.atomizer=com.synexia.ai.m3scale.M3FileAtomizer
java.typedRecipe=com.synexia.rewrite.M3RepositoryAtomizePatternizeRecipe
java.candidateRecipe=com.synexia.rewrite.M3DonorAssimilationRecipe
markdown.atomizer=com.synexia.ai.m3scale.M3DocumentAtomizer
markdown.mode=LOSSLESS_BLOCK_CANDIDATES_NO_PROSE_REWRITE
xml.mode=SECURE_PARSE_METADATA_NO_REWRITE
native.mode=REQUIRES_NATIVE_PARSER_AND_JNI_ABI_GATES
unknown.mode=EXACT_BYTES_WITH_EXPLICIT_RESIDUE
donor.catalogueOwner=com.synexia.donor.DonorMechanicalShapeCatalog
donor.reviewRecipe=com.synexia.rewrite.M3MechanicalDonorShapeReviewRecipe
donor.sources=LeetCode,HackerRank,GeeksForGeeks
donor.use=CATEGORY_REFERENCE_NOT_SOURCE_COPY_PERMISSION
original.pom=PRESERVE
original.parent=PRESERVE
original.tycho=PRESERVE
history.develop=APPEND_ONLY_NEVER_REBASE

estate.recipe=com.synexia.rewrite.M3EstateRecipeFirstDistillationRecipe
estate.challengeOrder=LeetCode,HackerRank,GeeksForGeeks
estate.sourceMutation=false
estate.donorSourceCopy=false
estate.promotion=false
